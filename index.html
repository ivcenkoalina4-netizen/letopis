<style>
  :root{
    --bg-deep:#1e1610;
    --bg-photo:#2a1f14;
    --cream:#f3ead9;
    --cream-soft:#efe3cd;
    --ink:#2a1f14;
    --gold:#c9a227;
    --gold-soft:#d9b96a;
    --muted:#8a7a63;
    --card:#261c14;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:var(--bg-deep);
    color:var(--cream);
    font-family:'Inter', system-ui, sans-serif;
    line-height:1.6;
    overflow-x:hidden;
  }
  h1,h2,h3,.serif{font-family:'Cormorant Garamond', Georgia, serif; font-weight:400}

  /* ХЕДЕР */
  header{
    position:relative; min-height:70vh;
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    text-align:center; padding:80px 24px 60px;
    background:
      linear-gradient(rgba(30,22,16,.82), rgba(30,22,16,.96)),
      url('https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=1600&q=80') center/cover;
    border-bottom:1px solid rgba(201,162,39,.15);
  }
  header::after{
    content:''; position:absolute; inset:0;
    background:radial-gradient(circle at 50% 40%, rgba(201,162,39,.12), transparent 60%);
    pointer-events:none;
  }
  header h1{
    font-size:clamp(3rem,11vw,8rem);
    letter-spacing:.06em; text-transform:uppercase; line-height:.95;
    color:var(--cream); text-shadow:0 4px 40px rgba(0,0,0,.5);
    position:relative; z-index:1;
  }
  header .subtitle{
    font-family:'Cormorant Garamond', serif; font-style:italic;
    font-size:clamp(1rem,2.5vw,1.4rem); color:var(--gold-soft);
    margin-top:18px; position:relative; z-index:1; max-width:600px;
  }
  header .divider{width:60px;height:1px;background:var(--gold);margin:28px auto 0;position:relative;z-index:1}

  /* ТАЙМЛАЙН */
  .timeline-section{background:var(--cream);color:var(--ink);padding:70px 24px 50px}
  .section-head{text-align:center;margin-bottom:36px}
  .section-head h2{font-size:clamp(2rem,5vw,3.4rem);color:var(--ink);letter-spacing:.02em}
  .section-head p{font-size:.85rem;color:var(--muted);letter-spacing:.2em;text-transform:uppercase;margin-top:8px}
  .timeline-wrap{max-width:1200px;margin:0 auto}
  .timeline{
    display:flex; height:140px;
    border:1px solid rgba(42,31,20,.15); border-radius:6px; overflow:hidden;
    background:var(--cream-soft);
  }
  .segment{
    flex:1; cursor:pointer; border-right:1px solid rgba(42,31,20,.12);
    padding:18px 20px; display:flex; flex-direction:column; justify-content:center;
    transition:background .3s, flex .3s; position:relative;
  }
  .segment:last-child{border-right:none}
  .segment:hover{background:#e8dcc2}
  .segment.active{background:#e6d5ad}
  .segment.active::after{content:'';position:absolute;left:0;bottom:0;width:100%;height:3px;background:var(--gold)}
  .segment .era-years{font-size:.75rem;letter-spacing:.15em;color:var(--muted);text-transform:uppercase}
  .segment .era-name{font-family:'Cormorant Garamond', serif;font-size:1.6rem;margin-top:6px;color:var(--ink)}
  .segment .era-sub{font-size:.78rem;color:var(--muted);margin-top:2px}
  @media(max-width:760px){
    .timeline{overflow-x:auto;height:120px}
    .segment{min-width:160px}
  }

  /* СТРАНЫ */
  .country-bar{
    display:flex; flex-wrap:wrap; gap:12px; justify-content:center;
    max-width:1200px; margin:0 auto; padding:40px 24px;
    background:var(--cream); color:var(--ink);
  }
  .country-btn{
    background:transparent; color:var(--ink);
    border:1px solid rgba(42,31,20,.25);
    padding:10px 26px; border-radius:40px;
    cursor:pointer; font-family:'Inter',sans-serif;
    font-size:.85rem; letter-spacing:.08em; transition:all .25s;
  }
  .country-btn:hover{border-color:var(--gold);color:var(--gold)}
  .country-btn.active{background:var(--gold);color:var(--bg-deep);border-color:var(--gold)}

  /* КОНТЕНТ */
  .epoch-content{display:none; animation:fadeUp .6s ease; background:var(--cream); color:var(--ink); padding:0 0 80px}
  .epoch-content.visible{display:block}
  @keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}

  .epoch-hero{max-width:1200px;margin:0 auto;padding:60px 24px 40px;text-align:center;position:relative}
  .epoch-hero .years{color:var(--gold);letter-spacing:.3em;font-size:.8rem;text-transform:uppercase}
  .epoch-hero h2{font-size:clamp(2.8rem,8vw,6rem);margin:14px 0 8px;line-height:1}
  .epoch-hero .country-tag{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.2rem;color:var(--muted)}
  .ambient-btn{
    margin-top:28px; background:var(--ink); color:var(--cream);
    border:none; padding:14px 34px; border-radius:40px;
    font-family:'Inter',sans-serif; font-size:.9rem; letter-spacing:.1em;
    cursor:pointer; display:inline-flex; align-items:center; gap:10px;
    transition:transform .2s, background .2s;
  }
  .ambient-btn:hover{transform:scale(1.04);background:var(--gold);color:var(--bg-deep)}
  .ambient-btn.playing{animation:pulse 1.2s infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 12px rgba(201,162,39,.15)}}

  .blocks{display:grid;grid-template-columns:1fr;gap:28px;max-width:1200px;margin:40px auto 0;padding:0 24px}
  @media(min-width:900px){
    .blocks{grid-template-columns:1fr 1fr}
    .block-wide{grid-column:1 / -1}
  }
  .block{background:#fbf5e8;border:1px solid rgba(42,31,20,.08);border-radius:8px;padding:34px;box-shadow:0 6px 24px rgba(42,31,20,.06)}
  .block h3{font-family:'Inter',sans-serif;font-size:.72rem;letter-spacing:.25em;text-transform:uppercase;color:var(--gold);margin-bottom:18px;font-weight:500}
  .block p{color:#3a2c1e;font-size:.98rem}
  .block .sub{color:var(--muted);font-size:.82rem;margin-top:14px;font-style:italic}

  /* АРХИТЕКТОРЫ */
  .architects{display:flex;gap:16px;overflow-x:auto;padding-bottom:12px;scrollbar-width:thin}
  .architects::-webkit-scrollbar{height:6px}
  .architects::-webkit-scrollbar-thumb{background:rgba(42,31,20,.2);border-radius:3px}
  .architect{
    min-width:170px; background:var(--cream-soft); border-radius:6px;
    padding:16px; cursor:pointer; border:1px solid transparent;
    transition:border .25s, transform .25s; text-align:center;
  }
  .architect:hover{border-color:var(--gold);transform:translateY(-2px)}
  .architect .avatar{
    width:100%; height:110px; border-radius:4px;
    background:linear-gradient(135deg,#d9c9a8,#c4b08a);
    margin-bottom:12px; display:flex; align-items:center; justify-content:center;
    color:rgba(42,31,20,.4); font-size:.7rem; letter-spacing:.1em;
    overflow:hidden; position:relative;
  }
  .architect .avatar img{width:100%;height:100%;object-fit:cover}
  .architect .name{font-family:'Cormorant Garamond',serif;font-size:1.15rem;color:var(--ink)}
  .architect .role{font-size:.75rem;color:var(--muted);margin-top:2px}

  /* ТЕХНОЛОГИИ */
  .tech-list{list-style:none}
  .tech-list li{display:flex;gap:14px;padding:12px 0;border-bottom:1px dashed rgba(42,31,20,.15);font-size:.92rem;color:#3a2c1e}
  .tech-list li:last-child{border-bottom:none}
  .tech-list .year{color:var(--gold);font-weight:500;min-width:56px;font-family:'Cormorant Garamond',serif;font-size:1.1rem}

  /* ГАЛЕРЕЯ */
  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
  .artifact{
    aspect-ratio:1; border-radius:6px; overflow:hidden;
    background:linear-gradient(135deg,#d9c9a8,#b9a47e);
    display:flex; align-items:center; justify-content:center;
    color:rgba(42,31,20,.55); font-size:.8rem; text-align:center;
    padding:12px; cursor:pointer; position:relative;
    border:1px solid rgba(42,31,20,.08); transition:transform .25s;
  }
  .artifact:hover{transform:scale(1.04)}
  .artifact img{width:100%;height:100%;object-fit:cover}
  .artifact span{position:relative;z-index:1}

  /* КНОПКА "ДАЛЬШЕ" */
  .next-era{text-align:center;margin-top:56px;padding:0 24px}
  .next-era button{
    background:transparent;color:var(--ink);border:1px solid var(--ink);
    padding:16px 44px;border-radius:40px;font-family:'Inter',sans-serif;
    font-size:.9rem;letter-spacing:.15em;text-transform:uppercase;
    cursor:pointer;transition:all .25s;
  }
  .next-era button:hover{background:var(--ink);color:var(--cream)}

  .placeholder{
    text-align:center;color:var(--muted);padding:60px 24px;font-style:italic;
    font-family:'Cormorant Garamond',serif;font-size:1.3rem;max-width:1200px;margin:0 auto;
  }
  .placeholder strong{color:var(--gold);font-style:normal}

  .epoch-footer{
    margin-top:70px;background:var(--bg-deep);color:var(--cream);
    padding:50px 24px;text-align:center;
  }
  .epoch-footer h4{font-family:'Cormorant Garamond',serif;font-size:2rem;color:var(--gold-soft);letter-spacing:.05em;margin-bottom:10px}
  .epoch-footer p{color:var(--muted);font-size:.85rem;letter-spacing:.1em}

  audio{display:none}

  .artifact-item{margin:0;text-align:center}
  .artifact-item figcaption{
    font-size:.78rem;color:#5a4a36;margin-top:6px;
    font-family:'Cormorant Garamond',serif;font-style:italic;
  }
</style>
</head>

/* =========================================================
   2. СОСТОЯНИЕ
   ========================================================= */
let currentEra = null;
let currentCountry = null;

const timelineEl   = document.getElementById('timeline');
const countryBarEl = document.getElementById('countryBar');
const contentEl    = document.getElementById('epochContent');
const player       = document.getElementById('player');

/* =========================================================
   3. ТАЙМЛАЙН
   ========================================================= */
function renderTimeline(){
  timelineEl.innerHTML = ERAS.map(era => `
    <div class="segment" data-era="${era.id}">
      <div class="era-years">${era.years}</div>
      <div class="era-name">${era.name}</div>
      <div class="era-sub">${era.sub}</div>
    </div>
  `).join('');

  timelineEl.querySelectorAll('.segment').forEach(seg => {
    seg.addEventListener('click', () => selectEra(seg.dataset.era));
  });
}

function selectEra(id){
  currentEra = ERAS.find(e => e.id === id);
  currentCountry = Object.keys(currentEra.countries)[0];

  timelineEl.querySelectorAll('.segment').forEach(s => {
    s.classList.toggle('active', s.dataset.era === id);
  });

  renderCountries();
  renderEpoch();
}

/* =========================================================
   4. СТРАНЫ
   ========================================================= */
const COUNTRY_LABELS = {
  Austria:'Австрия', Germany:'Германия', France:'Франция',
  USA:'США', UK:'Великобритания', USSR:'СССР'
};

function renderCountries(){
  if(!currentEra) return;
  const keys = Object.keys(currentEra.countries);
  countryBarEl.innerHTML = keys.map(k => `
    <button class="country-btn ${k === currentCountry ? 'active' : ''}" data-country="${k}">
      ${COUNTRY_LABELS[k] || k}
    </button>
  `).join('');

  countryBarEl.querySelectorAll('.country-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentCountry = btn.dataset.country;
      renderCountries();
      renderEpoch();
    });
  });
}

/* =========================================================
   5. РЕНДЕР ЭПОХИ
   ========================================================= */
function renderEpoch(){
  if(!currentEra || !currentCountry) return;
  const era = currentEra;
  const c = era.countries[currentCountry];

  const idx = ERAS.findIndex(e => e.id === era.id);
  const nextEra = ERAS[idx + 1];
  
  document.querySelector('header').style.backgroundImage =
  `linear-gradient(rgba(30,22,16,.82), rgba(30,22,16,.96)), url('${era.hero}')`;

  contentEl.classList.remove('visible');
  void contentEl.offsetWidth;

  contentEl.innerHTML = `
    <div class="epoch-hero">
      <div class="years">${era.years}</div>
      <h2>${era.name}</h2>
      <div class="country-tag">${COUNTRY_LABELS[currentCountry] || currentCountry}</div>
      <button class="ambient-btn" id="ambientBtn" ${era.ambient ? '' : 'disabled'}>
        ▶ Включить атмосферу
      </button>
    </div>

   <div class="blocks">
  <!-- Дух времени -->
  <div class="block block-wide">
    <h3>Дух времени</h3>
    <p>${era.spirit}</p>
    <div class="sub">${era.sub}</div>
  </div>

  <!-- Архитекторы звука -->
  <div class="block block-wide">
    <h3>Архитекторы звука</h3>
    <div class="architects">
      ${c.architects.map(a => `
        <div class="architect">
          <div class="avatar">
            ${a.photo ? `<img src="${a.photo}" alt="${a.name}" loading="lazy">` : 'фото'}
          </div>
          <div class="name">${a.name}</div>
          <div class="role">${a.role}</div>
        </div>
      `).join('')}
    </div>
  </div>

  <!-- Технологии и инструменты -->
  <div class="block">
    <h3>Технологии и инструменты</h3>
    <ul class="tech-list">
      ${c.tech.map(t => `<li><span class="year">${t.year}</span><span>${t.text}</span></li>`).join('')}
    </ul>
  </div>

  <!-- Артефакты эпохи -->
  <div class="block">
    <h3>Артефакты эпохи</h3>
    <div class="gallery">
      ${c.artifacts.map(a => `
        <figure class="artifact-item">
          <div class="artifact">
            ${a.img ? `<img src="${a.img}" alt="${a.name}">` : `<span>${a.name}</span>`}
          </div>
          <figcaption>${a.name}</figcaption>
        </figure>
      `).join('')}
    </div>
  </div>
</div>

    ${nextEra ? `
      <div class="next-era">
        <button id="nextEraBtn">Перейти к эпохе «${nextEra.name}» →</button>
      </div>
    ` : `
      <div class="placeholder">Вы прошли все эпохи. <strong>Спасибо!</strong></div>
    `}

    <div class="epoch-footer">
      <h4>Конец эпохи</h4>
      <p>${era.name} · ${COUNTRY_LABELS[currentCountry] || currentCountry} · ${era.years}</p>
    </div>
  `;

  contentEl.classList.add('visible');

  const ambientBtn = contentEl.querySelector('#ambientBtn');
  if(ambientBtn && era.ambient){
    ambientBtn.addEventListener('click', () => toggleAmbient(era.ambient, ambientBtn));
  }

  const nextBtn = contentEl.querySelector('#nextEraBtn');
  if(nextBtn && nextEra){
    nextBtn.addEventListener('click', () => {
      selectEra(nextEra.id);
      document.querySelector('.timeline-section').scrollIntoView({behavior:'smooth', block:'start'});
    });
  }
}

/* =========================================================
   6. АУДИО
   ========================================================= */
function toggleAmbient(src, btn){
  // если включён другой трек — сбрасываем на новый
  if(!player.src || player.src.indexOf(src) === -1){
    player.pause();
    player.src = src;
    player.load();
  }

  // если уже играет — ставим паузу
  if(!player.paused){
    player.pause();
    btn.textContent = '▶ Включить атмосферу';
    btn.classList.remove('playing');
    return;
  }

  // иначе — включаем
  player.play().then(() => {
    btn.textContent = '❚❚ Пауза';
    btn.classList.add('playing');
  }).catch(() => {
    btn.textContent = '⚠ Аудио недоступно';
  });
}
/* =========================================================
   7. СТАРТ
   ========================================================= */
renderTimeline();
selectEra('classic');
</script>
